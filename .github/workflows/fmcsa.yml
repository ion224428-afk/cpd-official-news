name: Collect official FMCSA news
on:
  push:
    paths: [collector.mjs, .github/workflows/fmcsa.yml]
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'
permissions:
  contents: write
concurrency:
  group: official-fmcsa-news
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - run: node collector.mjs
      - name: Save verified public news
        run: |
          git config user.name 'CPD official news collector'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add fmcsa-news.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh verified official FMCSA news'
          git push

